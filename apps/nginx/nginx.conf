worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # AC17: rate limits on auth-adjacent and health paths. Keyed on the
    # connecting IP — see plan.md's Design decisions for the caveat this
    # implies if another reverse proxy sits in front of this stack.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=healthz:10m rate=60r/m;
    # nginx's limit_req default rejection status is 503; AC17 requires 429.
    limit_req_status 429;

    # Round-6 REVIEW Blocker: this Nginx has no TLS listener, so $scheme
    # is always "http" — unconditionally forwarding it as
    # X-Forwarded-Proto overwrote whatever an outer TLS-terminating
    # proxy (AC20's documented topology) had already set, so Auth.js
    # (which keys `useSecureCookies` off the forwarded proto) issued
    # session cookies without `Secure`/`__Host-` even when the operator
    # followed the guide's own recommended setup.
    #
    # Round-7 REVIEW fix: an exact `https https;` match let a proxy that
    # *appends* to the header instead of replacing it (a common pattern:
    # `proxy_set_header X-Forwarded-Proto "$http_x_forwarded_proto,
    # $scheme"`) produce a comma-list value like `, https`, which missed
    # the exact match and silently fell through to `$scheme` (`http`) —
    # reopening the original Blocker with no signal to the operator.
    #
    # Round-8 REVIEW correction: the round-7 fix matched the *last*
    # comma-separated element, reasoning that the nearest proxy's own
    # appended observation was most trustworthy. Two independent
    # reviewers demonstrated live that this is backwards for this
    # project's actual documented topology (an outer TLS-terminating
    # proxy, guide § TLS warning) — the *first* element is the one
    # naming what protocol the real client used; every hop after that
    # is necessarily internal, and internal hops in a Docker-network
    # deployment are routinely plaintext by design, so trusting the
    # *last* element rejects the exact "edge terminates TLS, forwards
    # plaintext to this Nginx" setup the guide recommends: probing with
    # `X-Forwarded-Proto: https, http` (a real client on HTTPS, an
    # internal plaintext hop) incorrectly produced a non-Secure cookie
    # under the round-7 regex. Matches the *first* non-empty element
    # instead, skipping any leading empty/comma noise from the
    # `$http_x_forwarded_proto,$scheme`-style append pattern above.
    #
    # This header is trusted unconditionally, including with no outer
    # proxy present at all (the operator's most common install, per the
    # guide's own step 4) — the client fully controls it in that case.
    # That's deliberate, not an oversight: browsers refuse to store a
    # `Secure`/`__Host-` cookie delivered over a plaintext response, so
    # a forged `https` value only breaks *the forger's own* login (their
    # browser discards the cookie) — it cannot downgrade or otherwise
    # affect any other visitor's session, and the header isn't
    # CORS-safelisted, so a malicious page can't make a victim's browser
    # send it either. The dangerous direction is the downgrade this
    # fix closes, not the self-inflicted case left open.
    map $http_x_forwarded_proto $forwarded_proto {
        default                                 $scheme;
        "~*^\s*(?:,\s*)*https\s*(?:,|$)"        https;
    }

    server {
        listen 80;
        server_name _;

        # AC21: forwarded so Next.js's Server Action Origin/Host check
        # and NextAuth's callback URLs work correctly behind this proxy.
        # Inherited by every location below (nginx propagates
        # proxy_set_header down from server{} into location{} unless a
        # location overrides it).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        # HTTP/1.0 to the upstream can't use chunked transfer encoding,
        # which is how Next.js streams RSC/HTML responses — the upstream
        # response would instead be delimited by connection close
        # (upstream keep-alive would additionally need an `upstream {}`
        # block + `Connection ""`, not done here).
        proxy_http_version 1.1;

        # Baseline response headers (round-6 REVIEW Nit; formalized as
        # spec AC23 round-17) — defence in depth, not a response to a
        # live exploit (SameSite=Lax already blunts framed-cookie
        # attacks). AC23 is the canonical source for these values —
        # this block implements them, it doesn't own them.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # round-16 REVIEW finding: base-uri/form-action only — a full
        # script-src policy would break Next.js's inline bootstrap
        # scripts and needs nonces, out of scope here.
        add_header Content-Security-Policy "base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        location /signup {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://web:3000;
        }

        location /login {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://web:3000;
        }

        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://web:3000;
        }

        location /healthz {
            limit_req zone=healthz burst=10 nodelay;
            proxy_pass http://web:3000;
        }

        location / {
            proxy_pass http://web:3000;
        }
    }
}
