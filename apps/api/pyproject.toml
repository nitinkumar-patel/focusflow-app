[project]
name = "focusflow-api"
version = "0.1.0"
description = "FocusFlow internal API (FastAPI)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pydantic[email]>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Alembic-generated migration bodies are boilerplate we don't hand-edit
# for style; linting them just fights the generator on every revision.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's dependency-injection pattern requires `Depends(...)`
# as an argument default — that's not an accidental function call, it's
# the framework's documented API. Recurs on every route handler.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Module-level async engines (tests/conftest.py's test_engine) hold a
# connection pool bound to whichever event loop first used it; a
# function-scoped loop (pytest-asyncio's default) closes that loop after
# every test and the pool then fails on the next test with "Event loop
# is closed". Session-scoping the loop matches the engine's lifetime.
# Both settings are required: the *fixture* loop scope alone leaves
# tests themselves on a per-function loop, which is a cross-loop
# mismatch against session-scoped fixtures (asyncpg connections opened
# under one loop, torn down under another) — same failure, easy to
# half-fix by setting only one of the two.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
