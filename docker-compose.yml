services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-focusflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-focusflow}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-focusflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      target: dev
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    env_file: .env
    depends_on:
      - api

  nginx:
    build:
      context: ./apps/nginx
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  db_data:
