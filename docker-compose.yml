services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-focusflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-focusflow}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-focusflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      target: dev
    # Explicit list (not env_file: .env), same reasoning as web below —
    # api has no use for AUTH_SECRET or POMODORO_TEST_SHORT_INTERVALS.
    environment:
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      POSTGRES_USER: ${POSTGRES_USER:-focusflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-focusflow}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    # Explicit list (not env_file: .env) so web never receives
    # POSTGRES_* secrets it has no use for — compose reads .env
    # automatically for the ${...} substitutions below.
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      API_BASE_URL: ${API_BASE_URL}
      POMODORO_TEST_SHORT_INTERVALS: ${POMODORO_TEST_SHORT_INTERVALS:-}
    depends_on:
      - api

  nginx:
    build:
      context: ./apps/nginx
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  db_data:
