services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-focusflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-focusflow}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-focusflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      target: dev
    # Explicit list (not env_file: .env), same reasoning as web below —
    # api has no use for AUTH_SECRET or POMODORO_TEST_SHORT_INTERVALS.
    environment:
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      POSTGRES_USER: ${POSTGRES_USER:-focusflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-focusflow}
    depends_on:
      db:
        condition: service_healthy
    # round-6 REVIEW finding: no service but `db` restarted on crash or
    # came back after a host reboot — a self-hosted deliverable (AC15)
    # needs both. stdlib-only healthcheck (no curl/wget in the slim
    # image) so it costs nothing to add.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./apps/web
    # Explicit list (not env_file: .env) so web never receives
    # POSTGRES_* secrets it has no use for — compose reads .env
    # automatically for the ${...} substitutions below.
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      API_BASE_URL: ${API_BASE_URL}
      POMODORO_TEST_SHORT_INTERVALS: ${POMODORO_TEST_SHORT_INTERVALS:-}
    depends_on:
      - api
    restart: unless-stopped
    # Liveness only — any HTTP response (200 or /healthz's own 503) means
    # the Next.js server itself is up; only a connection failure counts
    # as unhealthy. round-7 REVIEW fix: checking r.ok made this deep-probe
    # apps/api transitively (via /healthz's own proxy), and nginx (below)
    # hard-gates on this service being healthy — so an api outage used to
    # take the whole front door down instead of degrading to /healthz's
    # real 503.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    build:
      context: ./apps/nginx
    ports:
      - "80:80"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
