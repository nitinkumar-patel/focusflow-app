name: CI

on:
  push:
  pull_request:

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sca-web:
    name: SCA (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit
        working-directory: apps/web
        run: npm audit --audit-level=high

  sca-api:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project and audit
        working-directory: apps/api
        run: |
          pip install .
          pip install pip-audit
          pip-audit

  container-scan:
    name: Container image scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, web, nginx]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service }} image
        # Build via `docker compose build`, not a standalone `docker
        # build`, so the scanned image's target/context always matches
        # docker-compose.yml (single source of truth — round-2 REVIEW
        # fix: a prior version hardcoded --target dev for api here,
        # which could silently desync if docker-compose.yml's target
        # ever changed without this workflow being updated too).
        run: docker compose -p focusflow-ci build ${{ matrix.service }}
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: focusflow-ci-${{ matrix.service }}:latest
          severity: HIGH,CRITICAL
          exit-code: "1"
